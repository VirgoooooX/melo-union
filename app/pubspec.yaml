name: melo_union_app
description: Phase 1-5 Flutter MVP skeleton for MeloUnion.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: ^2.34.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^8.1.0
  go_router: ^14.2.0
  window_manager: ^0.4.3
  music_data:
    path: ../packages/music_data
  music_domain:
    path: ../packages/music_domain
  path: ^1.9.1
  provider_netease:
    path: ../packages/provider_netease
  provider_qq:
    path: ../packages/provider_qq
  provider_contract:
    path: ../packages/provider_contract
  qr_flutter: ^4.1.0
  just_audio: ^0.9.43
  just_audio_windows: ^0.2.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  just_audio_windows:
    path: ../packages/just_audio_windows_patched

flutter:
  uses-material-design: true
