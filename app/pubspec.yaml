name: melo_union_app
description: Phase 1-5 Flutter MVP skeleton for MeloUnion.
publish_to: none
version: 2.1.5+22

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^4.0.7
  audio_metadata_reader: ^1.6.0
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.4
  crypto: ^3.0.6
  drift: ^2.34.0
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^8.1.0
  go_router: ^14.2.0
  http: ^1.5.0
  launch_at_startup: ^0.5.1
  window_manager: ^0.4.3
  tray_manager: ^0.5.3
  music_data:
    path: ../packages/music_data
  music_domain:
    path: ../packages/music_domain
  path: ^1.9.1
  provider_netease:
    path: ../packages/provider_netease
  provider_qq:
    path: ../packages/provider_qq
  provider_kugou:
    path: ../packages/provider_kugou
  provider_contract:
    path: ../packages/provider_contract
  qr_flutter: ^4.1.0
  just_audio: ^0.9.43
  audio_session: ^0.1.25
  just_audio_background: ^0.0.1-beta.17
  just_audio_windows: ^0.2.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.16.0

dependency_overrides:
  audio_metadata_reader:
    path: ../packages/audio_metadata_reader_patched
  just_audio_windows:
    path: ../packages/just_audio_windows_patched

flutter:
  uses-material-design: true
  assets:
    - assets/images/melo_logo.png
    - assets/images/melo_logo_inverse.png
    - assets/images/netease_logo.png
    - assets/images/qq_logo.png
    - assets/images/kugou_logo.png
    - windows/runner/resources/app_icon.ico

msix_config:
  display_name: MeloUnion
  publisher_display_name: MeloUnion
  identity_name: MeloUnion.MeloUnion
  publisher: CN=MeloUnion
  logo_path: ../docs/logo-transparent.png
  trim_logo: false
  capabilities: internetClient
  generate_signing_certificate: true
