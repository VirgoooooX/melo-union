name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_android:
        description: '是否编译安卓端 (Build Android APK)'
        type: boolean
        required: true
        default: true
      build_windows:
        description: '是否编译Windows端 (Build Windows App & Installer)'
        type: boolean
        required: true
        default: true
      release_tag:
        description: '发布标签名称 (Release Tag, e.g. v1.0.2 - 仅手动触发时有效)'
        required: false
        default: 'v-draft'

permissions:
  contents: write

jobs:
  release-config:
    name: Resolve release targets
    runs-on: ubuntu-latest
    outputs:
      build_android: ${{ steps.config.outputs.build_android }}
      build_windows: ${{ steps.config.outputs.build_windows }}
      tag: ${{ steps.config.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve targets
        id: config
        shell: bash
        run: |
          # 1. Resolve release tag name
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Default builds to true
          build_android="true"
          build_windows="true"

          # 2. Parse targets
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_android="${{ inputs.build_android }}"
            build_windows="${{ inputs.build_windows }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Fetch tag annotations
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
            
            # Check annotation message
            if grep -qi '^platform=windows$' <<< "$tag_message"; then
              build_android="false"
            elif grep -qi '^platform=android$' <<< "$tag_message"; then
              build_windows="false"
            # Fallback check of tag name suffix for backward compatibility
            elif [[ "${GITHUB_REF_NAME}" == *"-windows" ]]; then
              build_android="false"
            elif [[ "${GITHUB_REF_NAME}" == *"-android" ]]; then
              build_windows="false"
            fi
          fi

          echo "build_android=${build_android}" >> "$GITHUB_OUTPUT"
          echo "build_windows=${build_windows}" >> "$GITHUB_OUTPUT"

  build-android:
    name: Build Android APK
    needs: release-config
    if: needs.release-config.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos 2.9.0
          dart pub global run melos bootstrap

      - name: Build Release APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Prepare Artifact
        run: |
          mkdir -p dist-apk
          mv app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist-apk/MeloUnion-Android-arm32.apk
          mv app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist-apk/MeloUnion-Android-arm64.apk
          mv app/build/app/outputs/flutter-apk/app-x86_64-release.apk dist-apk/MeloUnion-Android-x64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-apk/
          if-no-files-found: error

  build-windows:
    name: Build Windows App
    needs: release-config
    if: needs.release-config.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Melos & Bootstrap
        run: |
          dart pub global activate melos 2.9.0
          dart pub global run melos bootstrap

      - name: Build Release Windows
        run: |
          cd app
          flutter pub get
          flutter build windows --release
        shell: bash

      - name: Compress Windows Build Folder
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath MeloUnion-Windows-x64.zip
        shell: pwsh

      - name: Build MSIX Installer
        run: |
          cd app
          flutter pub run msix:create --install-certificate false
          mv build/windows/x64/runner/Release/*.msix ../MeloUnion-Windows-Installer.msix
        shell: bash

      - name: Compile .exe Installer (Inno Setup)
        run: |
          iscc /dAppVersion="${{ needs.release-config.outputs.tag }}" tooling/installer.iss
        shell: cmd

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: MeloUnion-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: MeloUnion-Windows-Installer.msix
          if-no-files-found: error

      - name: Upload Windows Exe Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: MeloUnion-Windows-Setup.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [release-config, build-android, build-windows]
    if: |
      always() &&
      needs.release-config.result == 'success' &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./dist

      - name: Download Windows Zip Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: ./dist

      - name: Download Windows Installer Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: ./dist

      - name: Download Windows Exe Setup Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist

      - name: Verify Artifacts
        run: ls -R ./dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-config.outputs.tag }}
          files: ./dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
